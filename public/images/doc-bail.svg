  <line x1="48" y1="568" x2="552" y2="568" stroke="#E7E6DF"/>

  <text x="48" y="596" font-family="Helvetica, Arial" font-size="9" font-weight="700" fill="#6D7679" letter-spacing=".8">OBLIGATIONS &amp; CLAUSES</text>
  <g font-family="Helvetica, Arial" font-size="9" fill="#445155">
    <text x="48" y="618">Le locataire s'engage à payer le loyer et les charges aux termes convenus.</text>
    <text x="48" y="634">Le bailleur s'engage à délivrer un logement décent et à assurer la jouissance paisible.</text>
    <text x="48" y="650">Les réparations locatives sont définies par le décret n° 87-712 du 26 août 1987.</text>
    <text x="48" y="666">La révision annuelle du loyer intervient à la date anniversaire du bail, selon l'IRL.</text>
  </g>

