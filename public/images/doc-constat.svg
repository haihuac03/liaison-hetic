<svg xmlns="http://www.w3.org/2000/svg" width="600" height="850" viewBox="0 0 600 850">
  <rect width="600" height="850" fill="#FBFAF6"/>
  <rect x="0" y="0" width="600" height="10" fill="#8A4C1F"/>
  <text x="48" y="66" font-family="Helvetica, Arial" font-size="18" font-weight="700" fill="#243B47" letter-spacing="1.5">LIAISON</text>
  <text x="48" y="82" font-family="Helvetica, Arial" font-size="9" fill="#6D7679">Dossier #2841 · Constat</text>
  <rect x="446" y="48" width="106" height="28" rx="8" fill="#F8E2CB"/>
  <text x="468" y="66" font-family="Helvetica, Arial" font-size="9" font-weight="700" fill="#8A4C1F">CONSTAT</text>
  <text x="48" y="150" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#1C272C">Constat amiable</text>
  <text x="48" y="174" font-family="Helvetica, Arial" font-size="10" fill="#6D7679">Fuite sous le siphon de la cuisine · 27 octobre 2026</text>
  <line x1="48" y1="198" x2="552" y2="198" stroke="#E7E6DF"/>

  <text x="48" y="228" font-family="Helvetica, Arial" font-size="9" font-weight="700" fill="#6D7679" letter-spacing="1">PARTIES</text>
