  <text x="320" y="252" font-family="Helvetica, Arial" font-size="12" font-weight="700" fill="#1C272C">Claire Bernard · Bailleur</text>

  <text x="48" y="300" font-family="Helvetica, Arial" font-size="9" font-weight="700" fill="#6D7679" letter-spacing="1">FAITS CONSTATÉS</text>
  <line x1="48" y1="314" x2="552" y2="314" stroke="#E7E6DF"/>
  <g font-family="Helvetica, Arial" font-size="10" fill="#445155">
    <text x="48" y="338">Un écoulement continu est observé au niveau de la bague du siphon en PVC.</text>
    <text x="48" y="356">Une bassine a été placée sous le raccord afin de protéger le fond du meuble.</text>
    <text x="48" y="374">Trois photographies horodatées ont été transmises via la plateforme LIAISON.</text>
    <text x="48" y="392">Le devis D482 de Plomberie Martin S.A.S. d'un montant de 145,00 € TTC a été validé.</text>
  </g>

  <rect x="48" y="426" width="504" height="98" rx="10" fill="#F2F1EC"/>
  <text x="64" y="450" font-family="Helvetica, Arial" font-size="9" font-weight="700" fill="#6D7679">RÉSOLUTION AMIABLE</text>
  <text x="64" y="474" font-family="Helvetica, Arial" font-size="10" fill="#445155">Réparation du siphon et des joints par l'artisan certifié LIAISON.</text>
  <text x="64" y="492" font-family="Helvetica, Arial" font-size="10" fill="#445155">Prise en charge intégrale par le bailleur au titre de la vétusté.</text>
  <text x="64" y="510" font-family="Helvetica, Arial" font-size="10" fill="#445155">Intervention programmée le jeudi 29 octobre 2026, de 14h00 à 16h00.</text>

  <rect x="48" y="552" width="160" height="112" rx="10" fill="#EAE9E2"/>
  <rect x="220" y="552" width="160" height="112" rx="10" fill="#E2EDF3"/>
